name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  quality:
    name: Format, lint, test, and package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check TOML formatting
        run: |
          cargo install taplo-cli --version 0.10.0 --locked
          git ls-files '*.toml' -z | xargs -0 taplo fmt --check --diff

      - name: Check Markdown, YAML, and JSON formatting
        run: npx --yes prettier@3.9.9 --check "**/*.{md,yml,yaml,json,jsonc}"

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --locked --verbose

      - name: Run tests
        run: cargo test --locked --all-targets --verbose

      - name: Validate package
        run: cargo package --locked

  scanner-self-test:
    name: Scanner integration tests
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build scanner
        run: cargo build --locked

      - name: Test on self
        run: ./target/debug/binhards ./target/debug/binhards

      - name: Test on system binaries
        run: |
          echo "=== Testing /bin/ls ==="
          ./target/debug/binhards /bin/ls

          echo "=== Testing /bin/cat ==="
          ./target/debug/binhards /bin/cat

          echo "=== Testing JSON output ==="
          ./target/debug/binhards --json /bin/ls

      - name: Compile test binaries
        run: |
          cat > test_program.c <<'EOF'
          #include <stdio.h>
          #include <string.h>

          int main(int argc, char *argv[]) {
              char buffer[100];
              if (argc > 1) {
                  strcpy(buffer, argv[1]); // Intentionally unsafe for testing
                  printf("Input: %s\\n", buffer);
              }
              return 0;
          }
          EOF

          gcc -o test_vuln_none test_program.c
          gcc -Wl,-z,relro,-z,now -fstack-protector-strong -fPIE -pie -D_FORTIFY_SOURCE=2 -O2 -o test_vuln_hardened test_program.c

      - name: Test on compiled binaries
        run: |
          echo "=== Testing vulnerable binary ==="
          ./target/debug/binhards ./test_vuln_none

          echo "=== Testing hardened binary ==="
          ./target/debug/binhards ./test_vuln_hardened

  macho-fat:
    name: Mach-O fat binary integration test
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build scanner
        run: cargo build --locked

      - name: Build universal test binary
        run: |
          cat > macho_test.c <<'EOF'
          int main(void) {
              return 0;
          }
          EOF
          clang -arch x86_64 -arch arm64 -fPIE -pie -o macho_test macho_test.c
          file macho_test
          lipo -info macho_test

      - name: Test Mach-O fat analysis
        run: ./target/debug/binhards --json ./macho_test
