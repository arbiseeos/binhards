# Release configuration for cargo-release.
#
# cargo-release owns versioning, the release commit, the git tag, and the push.
# crates.io publishing stays in GitHub Actions via Trusted Publishing.

allow-branch = ["main"]
publish = false
push = true
tag = true
tag-name = "v{{version}}"
tag-message = "Release {{version}}"
pre-release-commit-message = "chore(release): {{version}}"

# Generate the release changelog before cargo-release creates the release commit.
pre-release-hook = [
  "git-cliff",
  "--unreleased",
  "--tag",
  "v{{version}}",
  "--prepend",
  "CHANGELOG.md",
]
